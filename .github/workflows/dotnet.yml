name: Build and Test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
  
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build
      run: dotnet build src --no-restore

    - name: Fail on vulnerable dependencies
      # SCA gate: dotnet list package --vulnerable exits 0 even when advisories are found,
      # so inspect its output and fail the job on any reported vulnerability. Runs after
      # restore/build so transitive resolution is available.
      run: |
        set -euo pipefail
        report=$(dotnet list src package --vulnerable --include-transitive)
        echo "$report"
        if echo "$report" | grep -q 'has the following vulnerable packages'; then
          echo "FAIL: one or more dependencies have known advisories."
          exit 1
        fi

    - name: Test
      run: dotnet test src --no-build --verbosity normal
