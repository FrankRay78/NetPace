name: Build and Release Cross-Platform Binaries

on:
  push:
    tags:
      - '*'  # Match any tag like 0.4.0, 1.0.0, etc.

jobs:
  build-cross-platform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        deployment: [self-contained, framework-dependent]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src

      - name: Set deployment flags
        id: deployment_flags
        run: |
          if [ "${{ matrix.deployment }}" = "self-contained" ]; then
            echo "self_contained=true" >> $GITHUB_OUTPUT
            echo "suffix=-standalone" >> $GITHUB_OUTPUT
          else
            echo "self_contained=false" >> $GITHUB_OUTPUT
            echo "suffix=-net8" >> $GITHUB_OUTPUT
          fi

      - name: Publish Console App
        run: |
          dotnet publish src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained ${{ steps.deployment_flags.outputs.self_contained }} \
            --output ./publish/${{ matrix.runtime }}-${{ matrix.deployment }} \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
            -p:PublishSingleFile=true

      - name: Build NetPace.Core.dll (library) with version
        run: |
          dotnet build src/NetPace.Core/NetPace.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.get_version.outputs.version }}
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }}

      - name: Create archive
        run: |
          cd ./publish/${{ matrix.runtime }}-${{ matrix.deployment }}
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            zip -r ../../netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}.zip .
          else
            tar -czf ../../netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}.tar.gz .
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netpace-${{ matrix.runtime }}-${{ matrix.deployment }}
          path: |
            *.zip
            *.tar.gz

  attach-to-release:
    needs: build-cross-platform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Attach binaries to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
