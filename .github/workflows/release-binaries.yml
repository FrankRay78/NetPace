name: Build and Release Cross-Platform Binaries

on:
  push:
    tags:
      - '*'  # Match any tag like 0.4.0, 1.0.0, etc.

jobs:
  build-cross-platform:
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        deployment: [self-contained, framework-dependent]
        include:
          - runtime: linux-x64
            deployment: aot
            runs_on: ubuntu-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          - runtime: linux-arm64
            deployment: aot
            runs_on: ubuntu-24.04-arm
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          - runtime: win-x64
            deployment: aot
            runs_on: windows-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          # windows-11-arm runner is GA (April 2025) and free for public repos. Native ARM64 host preserves the
          # same-job smoke test; cross-compile from windows-latest is rejected — see docs/RELEASING.md §Runner per RID.
          - runtime: win-arm64
            deployment: aot
            runs_on: windows-11-arm
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner matches runtime (AOT only)
        if: matrix.deployment == 'aot'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            win-*)   expected="Windows" ;;
            linux-*) expected="Linux" ;;
            osx-*)   expected="macOS" ;;
            *)       echo "Unknown runtime prefix: ${{ matrix.runtime }}"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" != "$expected" ]; then
            echo "FAIL: AOT runtime ${{ matrix.runtime }} requires runner OS '$expected', got '$RUNNER_OS'."
            echo "A typo in matrix.include[*].runs_on would silently fall back to ubuntu-latest — guard catches that."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src

      - name: Set deployment flags
        id: deployment_flags
        run: |
          set -euo pipefail
          if [ "${{ matrix.deployment }}" = "self-contained" ]; then
            echo "self_contained=true" >> $GITHUB_OUTPUT
            echo "suffix=-standalone" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.deployment }}" = "aot" ]; then
            echo "self_contained=true" >> $GITHUB_OUTPUT
            echo "suffix=-aot" >> $GITHUB_OUTPUT
          else
            echo "self_contained=false" >> $GITHUB_OUTPUT
            echo "suffix=-net10" >> $GITHUB_OUTPUT
          fi

      - name: Publish Console App
        run: |
          set -euo pipefail
          if [ "${{ matrix.deployment }}" = "aot" ]; then
            dotnet publish src/NetPace.Console/NetPace.Console.csproj \
              --configuration Release \
              --runtime ${{ matrix.runtime }} \
              --self-contained ${{ steps.deployment_flags.outputs.self_contained }} \
              --output ./publish/${{ matrix.runtime }}-${{ matrix.deployment }} \
              -p:Version=${{ steps.get_version.outputs.version }} \
              -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
              -p:FileVersion=${{ steps.get_version.outputs.version }} \
              -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
              -p:SelfContained=${{ steps.deployment_flags.outputs.self_contained }} \
              -p:PublishAot=true \
              -p:InvariantGlobalization=true
          else
            dotnet publish src/NetPace.Console/NetPace.Console.csproj \
              --configuration Release \
              --runtime ${{ matrix.runtime }} \
              --self-contained ${{ steps.deployment_flags.outputs.self_contained }} \
              --output ./publish/${{ matrix.runtime }}-${{ matrix.deployment }} \
              -p:Version=${{ steps.get_version.outputs.version }} \
              -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
              -p:FileVersion=${{ steps.get_version.outputs.version }} \
              -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
              -p:SelfContained=${{ steps.deployment_flags.outputs.self_contained }} \
              -p:PublishSingleFile=true
          fi

      - name: Build NetPace.Core.dll (library) with version
        run: |
          dotnet build src/NetPace.Core/NetPace.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }}

      # shell: bash forces Git Bash on the Windows runners so the same script (zip vs tar) runs uniformly across all matrix entries.
      # Whitelist approach: archive the executable by name rather than the entire publish directory. All variants
      # (PublishSingleFile and Native AOT) produce a single binary by design; the publish dir may also contain
      # toolchain by-products (NetPace.Core.xml, netpace.pdb on Windows AOT, netpace.dbg on Linux AOT) that
      # must never ship to end users. Archiving by name keeps the release contract immune to whatever the
      # next toolchain version decides to emit alongside the binary.
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd ./publish/${{ matrix.runtime }}-${{ matrix.deployment }}
          archive_stem="../../netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            7z a "${archive_stem}.zip" netpace.exe
          else
            tar -czf "${archive_stem}.tar.gz" netpace
          fi

      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          archive_stem="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            listing=$(unzip -Z1 "${archive_stem}.zip")
          else
            listing=$(tar -tzf "${archive_stem}.tar.gz")
          fi
          echo "Archive contents:"
          echo "$listing"
          # Every release archive contains exactly one entry — the executable, under the name users type.
          # Comparing the listing against the expected name asserts both invariants at once: the whitelist held and the
          # executable was present in the publish dir (catching a silent build failure that produced no binary), and the
          # entry carries the lowercase name. The name half matters on the case-insensitive Windows runners, where the
          # archiver resolves a differently-cased binary and would otherwise ship it under that name.
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            expected="netpace.exe"
          else
            expected="netpace"
          fi
          if [ "$listing" != "$expected" ]; then
            echo "FAIL: archive ${archive_stem} must contain exactly one entry named '${expected}', found: ${listing}"
            exit 1
          fi

      # shell: bash forces Git Bash on the Windows runners so the unzip/tar branching reuses one script across Linux + Windows AOT entries.
      - name: Smoke test (AOT only)
        if: matrix.deployment == 'aot'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            archive="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}-aot.zip"
            unzip -q "$archive" -d "$smoke_dir"
            cd "$smoke_dir"
            ./netpace.exe --version
            ./netpace.exe --help
          else
            archive="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}-aot.tar.gz"
            tar -xzf "$archive" -C "$smoke_dir"
            cd "$smoke_dir"
            ./netpace --version
            ./netpace --help
          fi

      # The RID-specific tool package carries this RID's Native AOT binary, so it is packed here rather
      # than in the publishing job: Native AOT cannot be cross-compiled across operating systems or
      # architectures, and this is the only runner that matches the RID. The publishing job adds the
      # wrapper package and the two macOS packages and pushes the set — docs/RELEASING.md, .NET tool package.
      - name: Pack RID-specific .NET tool package (AOT only)
        if: matrix.deployment == 'aot'
        run: |
          set -euo pipefail
          dotnet pack src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
            --output ./tool-package

      - name: Upload RID-specific tool package (AOT only)
        if: matrix.deployment == 'aot'
        uses: actions/upload-artifact@v4
        with:
          name: tool-package-${{ matrix.runtime }}
          path: ./tool-package/*.nupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netpace-${{ matrix.runtime }}-${{ matrix.deployment }}
          path: |
            *.zip
            *.tar.gz

  # Every tag publishes the tool package, whether or not NetPace.Core changed: the conditional skip in
  # publish-nuget.yml is about the library's SemVer meaning and must not reach the CLI, whose users
  # install by version. Needing build-cross-platform means a failed or missing native build fails the
  # release before anything is pushed; the check below says which RID is missing.
  publish-tool-package:
    needs: build-cross-platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download RID-specific tool packages
        uses: actions/download-artifact@v4
        with:
          pattern: tool-package-*
          merge-multiple: true
          path: ./tool-feed

      - name: Verify a Native AOT package arrived for every native RID
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          missing=false
          for runtime in win-x64 win-arm64 linux-x64 linux-arm64; do
            package="./tool-feed/NetPace.$runtime.$VERSION.nupkg"
            if [ ! -f "$package" ]; then
              echo "FAIL: no tool package for $runtime — its native build did not produce one."
              missing=true
            else
              echo "$runtime: $(stat -c%s "$package") bytes"
            fi
          done
          if [ "$missing" = "true" ]; then exit 1; fi

      - name: Restore dependencies
        run: dotnet restore src

      # macOS has no Native AOT build (out of scope), so its two RIDs ship framework-dependent packages
      # and run on the .NET runtime the SDK already provides. Both cross-pack fine from this runner.
      - name: Pack macOS tool packages
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          for runtime in osx-x64 osx-arm64; do
            dotnet pack src/NetPace.Console/NetPace.Console.csproj \
              --configuration Release \
              --runtime "$runtime" \
              -p:PackageVersion="$VERSION" \
              -p:Version="$VERSION" \
              -p:AssemblyVersion="$VERSION" \
              -p:FileVersion="$VERSION" \
              -p:InformationalVersion="$VERSION" \
              --output ./tool-feed
          done

      # The wrapper package is what users name: it carries no binary, only the list of RID packages the
      # installer picks from. CreateRidSpecificToolPackages=false stops this pack rebuilding the six
      # RID packages framework-dependent and overwriting the Native AOT ones above.
      - name: Pack wrapper tool package
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            -p:CreateRidSpecificToolPackages=false \
            -p:PackageVersion="$VERSION" \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            --output ./tool-feed

      # Installing from the packed feed and asking the command its version is the one check that spans
      # every part of the set: the wrapper resolves a RID package, the RID package carries a runnable
      # binary, and the binary reports the tag rather than the 0.0.0 source-build placeholder (#341 was
      # that drift, unnoticed, in the library package). Nothing is pushed if it fails.
      - name: Verify the installed tool reports the tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet tool install NetPace --version "$VERSION" --source ./tool-feed --tool-path ./tool-check
          reported=$(./tool-check/netpace --version)
          echo "netpace --version reported: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "FAIL: the installed tool reports '$reported', not the tag '$VERSION'."
            exit 1
          fi

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./tool-feed/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  attach-to-release:
    needs: build-cross-platform
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Archives only: the tool packages ride the same workflow but are pushed to NuGet, not attached
      # to the release, and `files: ./artifacts/**/*` below would otherwise attach every .nupkg too.
      - name: Download all archive artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: netpace-*
          path: ./artifacts

      - name: Verify framework-dependent and AOT binaries are smaller than standalone
        run: |
          set -euo pipefail
          failed=false
          for runtime in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            standalone=$(find "./artifacts/netpace-$runtime-self-contained" -type f 2>/dev/null | head -1 || true)
            if [ -z "$standalone" ]; then
              echo "FAIL: standalone artifact missing for $runtime"
              failed=true
              continue
            fi
            standalone_size=$(stat -c%s "$standalone")
            for variant in framework-dependent aot; do
              # AOT variant exists for Linux and Windows RIDs only (macOS AOT is out of scope)
              if [ "$variant" = "aot" ] && [[ "$runtime" != linux-* && "$runtime" != win-* ]]; then continue; fi
              target=$(find "./artifacts/netpace-$runtime-$variant" -type f 2>/dev/null | head -1 || true)
              if [ -z "$target" ]; then
                echo "FAIL: $variant artifact missing for $runtime"
                failed=true
                continue
              fi
              target_size=$(stat -c%s "$target")
              echo "$runtime $variant: ${target_size} bytes (standalone=${standalone_size} bytes)"
              if [ "$target_size" -ge "$standalone_size" ]; then
                echo "FAIL: $runtime $variant (${target_size}) is not smaller than standalone (${standalone_size})"
                failed=true
              fi
            done
          done
          if [ "$failed" = "true" ]; then exit 1; fi

      - name: Attach binaries to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
