name: Build and Release Cross-Platform Binaries

# Only semver-shaped tags trigger it, as for every release workflow: a tag means a release.
# docs/RELEASING.md, Release tags.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  build-cross-platform:
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      matrix:
        runtime: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
        deployment: [self-contained, framework-dependent]
        include:
          - runtime: linux-x64
            deployment: aot
            runs_on: ubuntu-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          - runtime: linux-arm64
            deployment: aot
            runs_on: ubuntu-24.04-arm
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          # 32-bit ARM Linux is the one deliberately cross-compiled AOT target, and native-only: there is no
          # hosted ARM32 runner, and the hosted ARM64 runners do not execute ARM32 code. It is built on x64
          # against a Debian 12 (Bookworm) armhf sysroot, the oldest system NetPace supports on these boards,
          # and smoke-tested under emulation. See docs/RELEASING.md, Runner per RID and Smoke-test contract.
          - runtime: linux-arm
            deployment: aot
            runs_on: ubuntu-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          - runtime: win-x64
            deployment: aot
            runs_on: windows-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          # windows-11-arm runner is GA (April 2025) and free for public repos. Native ARM64 host preserves the
          # same-job smoke test; cross-compile from windows-latest is rejected — see docs/RELEASING.md §Runner per RID.
          - runtime: win-arm64
            deployment: aot
            runs_on: windows-11-arm
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          # Native AOT cannot cross-compile between operating systems, so both macOS RIDs build on a Mac;
          # each gets a runner of its own architecture so the smoke test runs natively rather than through
          # Rosetta. macos-15-intel is GitHub's last x86_64 macOS image — see docs/RELEASING.md, When the
          # Intel Mac runner retires.
          - runtime: osx-x64
            deployment: aot
            runs_on: macos-15-intel
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true
          - runtime: osx-arm64
            deployment: aot
            runs_on: macos-latest
            publish_aot: true
            publish_single_file: false
            invariant_globalization: true

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify runner matches runtime (AOT only)
        if: matrix.deployment == 'aot'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            win-*)   expected="Windows" ;;
            linux-*) expected="Linux" ;;
            osx-*)   expected="macOS" ;;
            *)       echo "Unknown runtime prefix: ${{ matrix.runtime }}"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" != "$expected" ]; then
            echo "FAIL: AOT runtime ${{ matrix.runtime }} requires runner OS '$expected', got '$RUNNER_OS'."
            echo "A typo in matrix.include[*].runs_on would silently fall back to ubuntu-latest — guard catches that."
            exit 1
          fi
          # RIDs sharing a runner OS cannot be told apart by the check above, so their architecture is checked
          # directly. Swapping the two macOS runners would build osx-x64 on Apple silicon and smoke-test it
          # through Rosetta, or fail obscurely in the linker. linux-arm is the one cross-compiled target and the
          # cross-toolchain step below assumes an x64 host, so it is pinned to one too; landing it on the ARM64
          # runner would fail later and less clearly.
          case "${{ matrix.runtime }}" in
            osx-x64)   expected_arch="x86_64" ;;
            osx-arm64) expected_arch="arm64" ;;
            linux-arm) expected_arch="x86_64" ;;
            *)         expected_arch="" ;;
          esac
          if [ -n "$expected_arch" ] && [ "$(uname -m)" != "$expected_arch" ]; then
            echo "FAIL: AOT runtime ${{ matrix.runtime }} requires a $expected_arch runner, got $(uname -m)."
            exit 1
          fi

      # The sysroot step below and the smoke test both execute ARM32 code on an x64 host, so QEMU is
      # registered once here for the whole job rather than twice where it is used.
      - name: Register QEMU for ARM32 (linux-arm only)
        if: matrix.runtime == 'linux-arm'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # linux-arm is the one AOT target with no runner of its own, so it is cross-compiled, which needs three
      # things beyond the SDK. clang and lld, because the runner's own ld.bfd is configured for x86 alone and
      # refuses the ARM emulation mode the toolchain asks for; lld is multi-target and accepts it. The ARM32
      # binutils, because the AOT targets strip the finished binary with objcopy, and that has to be the
      # target's objcopy. And a sysroot holding the target's libc, libgcc and crt objects, which fixes the
      # oldest system the binary will start on: Debian 12 (Bookworm) carries glibc 2.36, so the sysroot is
      # Debian 12 armhf, taken from the official image with its development packages added under emulation.
      # The armhf packages on the Ubuntu runner's own ports would link against a far newer glibc and the
      # binary would not start on a Bookworm board at all. docs/RELEASING.md, Runner per RID.
      - name: Set up ARM32 cross-compilation toolchain and Debian 12 armhf sysroot (linux-arm only)
        if: matrix.runtime == 'linux-arm'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils-arm-linux-gnueabihf
          sysroot="$RUNNER_TEMP/armhf-sysroot"
          mkdir -p "$sysroot"
          docker run --platform linux/arm/v7 --name netpace-armhf-sysroot debian:12 \
            sh -c 'apt-get update -qq && apt-get install -y --no-install-recommends libc6-dev libgcc-12-dev zlib1g-dev'
          docker export netpace-armhf-sysroot | tar -x -C "$sysroot"
          docker rm netpace-armhf-sysroot
          # An incomplete sysroot would otherwise surface pages later as an unreadable linker error, so the
          # pieces the link needs are asserted here, where the cause is still in view.
          for probe in usr/lib/arm-linux-gnueabihf/libc.so usr/lib/gcc/arm-linux-gnueabihf/12/crtbeginS.o; do
            if [ ! -e "$sysroot/$probe" ]; then
              echo "FAIL: Debian 12 armhf sysroot is missing $probe — the package set has drifted."
              exit 1
            fi
          done
          echo "NETPACE_SYSROOT=$sysroot" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AssemblyVersion and FileVersion accept numbers alone, so they take the tag's numeric part
      # (0.27.0 for 0.27.0-rc1); every other version property takes the whole tag. docs/RELEASING.md,
      # Prerelease tags.
      - name: Extract version from tag
        id: get_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore src

      - name: Set deployment flags
        id: deployment_flags
        run: |
          set -euo pipefail
          if [ "${{ matrix.deployment }}" = "self-contained" ]; then
            echo "self_contained=true" >> $GITHUB_OUTPUT
            echo "suffix=-standalone" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.deployment }}" = "aot" ]; then
            echo "self_contained=true" >> $GITHUB_OUTPUT
            echo "suffix=-aot" >> $GITHUB_OUTPUT
          else
            echo "self_contained=false" >> $GITHUB_OUTPUT
            echo "suffix=-net10" >> $GITHUB_OUTPUT
          fi

      - name: Publish Console App
        run: |
          set -euo pipefail
          # Only the cross-compiled target adds anything here, and the sysroot step is the only thing that sets
          # NETPACE_SYSROOT, so every other matrix entry publishes exactly the command it did before. Held as a
          # word-split string rather than an array because this script also runs under the macOS runners' bash
          # 3.2, where expanding an empty array under `set -u` is an error; the path is one this workflow chose
          # and contains no spaces.
          cross_args=
          if [ -n "${NETPACE_SYSROOT:-}" ]; then
            cross_args="-p:SysRoot=$NETPACE_SYSROOT -p:LinkerFlavor=lld -p:ObjCopyName=arm-linux-gnueabihf-objcopy"
          fi
          if [ "${{ matrix.deployment }}" = "aot" ]; then
            dotnet publish src/NetPace.Console/NetPace.Console.csproj \
              --configuration Release \
              --runtime ${{ matrix.runtime }} \
              --self-contained ${{ steps.deployment_flags.outputs.self_contained }} \
              --output ./publish/${{ matrix.runtime }}-${{ matrix.deployment }} \
              -p:Version=${{ steps.get_version.outputs.version }} \
              -p:AssemblyVersion=${{ steps.get_version.outputs.numeric_version }} \
              -p:FileVersion=${{ steps.get_version.outputs.numeric_version }} \
              -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
              -p:SelfContained=${{ steps.deployment_flags.outputs.self_contained }} \
              -p:PublishAot=true \
              -p:InvariantGlobalization=true \
              $cross_args
          else
            dotnet publish src/NetPace.Console/NetPace.Console.csproj \
              --configuration Release \
              --runtime ${{ matrix.runtime }} \
              --self-contained ${{ steps.deployment_flags.outputs.self_contained }} \
              --output ./publish/${{ matrix.runtime }}-${{ matrix.deployment }} \
              -p:Version=${{ steps.get_version.outputs.version }} \
              -p:AssemblyVersion=${{ steps.get_version.outputs.numeric_version }} \
              -p:FileVersion=${{ steps.get_version.outputs.numeric_version }} \
              -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
              -p:SelfContained=${{ steps.deployment_flags.outputs.self_contained }} \
              -p:PublishSingleFile=true
          fi

      - name: Build NetPace.Core.dll (library) with version
        run: |
          dotnet build src/NetPace.Core/NetPace.Core.csproj \
            --configuration Release \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.numeric_version }} \
            -p:FileVersion=${{ steps.get_version.outputs.numeric_version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }}

      # shell: bash forces Git Bash on the Windows runners so the same script (zip vs tar) runs uniformly across all matrix entries.
      # Whitelist approach: archive the executable by name rather than the entire publish directory. All variants
      # (PublishSingleFile and Native AOT) produce a single binary by design; the publish dir may also contain
      # toolchain by-products (NetPace.Core.xml, netpace.pdb on Windows AOT, netpace.dbg on Linux AOT, the
      # netpace.dSYM folder on macOS AOT) that must never ship to end users. Archiving by name keeps the
      # release contract immune to whatever the next toolchain version decides to emit alongside the binary.
      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd ./publish/${{ matrix.runtime }}-${{ matrix.deployment }}
          archive_stem="../../netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            7z a "${archive_stem}.zip" netpace.exe
          else
            # COPYFILE_DISABLE stops Apple's tar writing extended attributes into a sibling ._netpace
            # member, which would break the one-entry contract below. GNU tar ignores it.
            COPYFILE_DISABLE=1 tar -czf "${archive_stem}.tar.gz" netpace
          fi

      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          archive_stem="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}${{ steps.deployment_flags.outputs.suffix }}"
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            listing=$(unzip -Z1 "${archive_stem}.zip")
          else
            listing=$(tar -tzf "${archive_stem}.tar.gz")
          fi
          echo "Archive contents:"
          echo "$listing"
          # Every release archive contains exactly one entry — the executable, under the name users type.
          # Comparing the listing against the expected name asserts both invariants at once: the whitelist held and the
          # executable was present in the publish dir (catching a silent build failure that produced no binary), and the
          # entry carries the lowercase name. The name half matters on the case-insensitive Windows runners, where the
          # archiver resolves a differently-cased binary and would otherwise ship it under that name.
          if [[ "${{ matrix.runtime }}" == win-* ]]; then
            expected="netpace.exe"
          else
            expected="netpace"
          fi
          if [ "$listing" != "$expected" ]; then
            echo "FAIL: archive ${archive_stem} must contain exactly one entry named '${expected}', found: ${listing}"
            exit 1
          fi

      # shell: bash forces Git Bash on the Windows runners so the unzip/tar branching reuses one script across all AOT entries.
      - name: Smoke test (AOT only)
        if: matrix.deployment == 'aot'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          if [[ "${{ matrix.runtime }}" == "linux-arm" ]]; then
            # The one target checked under emulation rather than on its own hardware, because no hosted ARM32
            # runner exists. The container is stock debian:12 armhf — the oldest system NetPace supports on
            # these boards, and what the binary was linked against — so this asserts both that the binary
            # really is ARM32 and that a Bookworm board carries every library it needs to start.
            archive="netpace-${{ steps.get_version.outputs.version }}-linux-arm-aot.tar.gz"
            tar -xzf "$archive" -C "$smoke_dir"
            docker run --rm --platform linux/arm/v7 -v "$smoke_dir:/smoke:ro" -w /smoke debian:12 \
              sh -c './netpace --version && ./netpace --help'
          elif [[ "${{ matrix.runtime }}" == win-* ]]; then
            archive="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}-aot.zip"
            unzip -q "$archive" -d "$smoke_dir"
            cd "$smoke_dir"
            ./netpace.exe --version
            ./netpace.exe --help
          else
            archive="netpace-${{ steps.get_version.outputs.version }}-${{ matrix.runtime }}-aot.tar.gz"
            tar -xzf "$archive" -C "$smoke_dir"
            cd "$smoke_dir"
            ./netpace --version
            ./netpace --help
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netpace-${{ matrix.runtime }}-${{ matrix.deployment }}
          path: |
            *.zip
            *.tar.gz

  attach-to-release:
    needs: build-cross-platform
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Verify framework-dependent and AOT binaries are smaller than standalone
        run: |
          set -euo pipefail
          failed=false
          for runtime in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            standalone=$(find "./artifacts/netpace-$runtime-self-contained" -type f 2>/dev/null | head -1 || true)
            if [ -z "$standalone" ]; then
              echo "FAIL: standalone artifact missing for $runtime"
              failed=true
              continue
            fi
            standalone_size=$(stat -c%s "$standalone")
            for variant in framework-dependent aot; do
              target=$(find "./artifacts/netpace-$runtime-$variant" -type f 2>/dev/null | head -1 || true)
              if [ -z "$target" ]; then
                echo "FAIL: $variant artifact missing for $runtime"
                failed=true
                continue
              fi
              target_size=$(stat -c%s "$target")
              echo "$runtime $variant: ${target_size} bytes (standalone=${standalone_size} bytes)"
              if [ "$target_size" -ge "$standalone_size" ]; then
                echo "FAIL: $runtime $variant (${target_size}) is not smaller than standalone (${standalone_size})"
                failed=true
              fi
            done
          done
          if [ "$failed" = "true" ]; then exit 1; fi

      # linux-arm is native-only, so it has no standalone archive to be measured against and is left out of the
      # loop above. Presence is still checked, and here rather than by the loop's own "artifact missing" branch,
      # so that a release cannot quietly go out without the ARM32 download. docs/RELEASING.md,
      # Size-assertion contract.
      - name: Verify the native-only ARM32 archive is present
        run: |
          set -euo pipefail
          archive=$(find "./artifacts/netpace-linux-arm-aot" -type f 2>/dev/null | head -1 || true)
          if [ -z "$archive" ]; then
            echo "FAIL: aot artifact missing for linux-arm — the release would publish without the 32-bit ARM download."
            exit 1
          fi
          echo "linux-arm aot: $(stat -c%s "$archive") bytes (native-only RID, no standalone archive to compare against)"

      - name: Attach binaries to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
