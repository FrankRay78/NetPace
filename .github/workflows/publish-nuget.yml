name: Publish NuGet Package

# Only semver-shaped tags trigger it, as for every release workflow: a tag means a release.
# docs/RELEASING.md, Release tags.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # Every release tag publishes NetPace.Core, whether or not the library changed since the last
  # one, so a release never leaves the library behind. docs/RELEASING.md, NetPace.Core publishes
  # on every release.
  publish:
    runs-on: ubuntu-latest
    # id-token: write lets the job request the OIDC token the NuGet login step exchanges for a key.
    # Naming permissions replaces the defaults, so contents: read keeps the checkout working.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AssemblyVersion and FileVersion accept numbers alone, so they take the tag's numeric part
      # (0.27.0 for 0.27.0-rc1); every other version property takes the whole tag. docs/RELEASING.md,
      # Prerelease tags.
      - name: Extract version from tag
        id: get_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore src

      # The compiler stamps the library's version, so the Build step needs the tag: Pack runs
      # with --no-build and can only set the package's own version.
      - name: Build
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.get_version.outputs.numeric_version }}
        run: |
          dotnet build src \
            --configuration Release \
            --no-restore \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$NUMERIC_VERSION" \
            -p:FileVersion="$NUMERIC_VERSION" \
            -p:InformationalVersion="$VERSION"

      - name: Pack
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.get_version.outputs.numeric_version }}
        run: |
          dotnet pack src/NetPace.Core/NetPace.Core.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion="$VERSION" \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$NUMERIC_VERSION" \
            -p:FileVersion="$NUMERIC_VERSION" \
            -p:InformationalVersion="$VERSION" \
            -p:RepositoryUrl=https://github.com/FrankRay78/NetPace \
            -o ./output

      - name: Verify packed library version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.get_version.outputs.version }}
          EXPECTED_NUMERIC_VERSION: ${{ steps.get_version.outputs.numeric_version }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'nupkg'
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Get-Item ./output/*.nupkg).FullName, $unpacked)
          $libraries = @(Get-ChildItem $unpacked -Recurse -Filter NetPace.Core.dll)
          if ($libraries.Count -eq 0) { throw 'No NetPace.Core.dll found in the package.' }
          foreach ($library in $libraries) {
            $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($library.FullName).Version.ToString(3)
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($library.FullName)
            $informational = ($info.ProductVersion -split '\+')[0]
            Write-Host "$($library.FullName): assembly=$assembly file=$($info.FileVersion) informational=$informational"
            # The assembly and file versions carry only the tag's numeric part; the informational version carries the whole tag.
            if ($assembly -ne $env:EXPECTED_NUMERIC_VERSION -or $info.FileVersion -ne $env:EXPECTED_NUMERIC_VERSION -or $informational -ne $env:EXPECTED_VERSION) {
              throw "Packed library does not report the tag's version $env:EXPECTED_VERSION."
            }
          }

      # Trusted publishing: nuget.org trusts this workflow file in this repository (a policy on the
      # nuget.org account) and exchanges the job's GitHub OIDC token for an API key that expires within
      # the hour, so no long-lived key is stored anywhere. Run immediately before the push, after every
      # gate, so the key exists only for the push. docs/RELEASING.md, Trusted publishing.
      - name: Log in to NuGet
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./output/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
