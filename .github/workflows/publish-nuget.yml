name: Publish NuGet Package

on:
  push:
    tags:
      - '*'  # Match any tag like 0.4.0, 1.0.0, etc.

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.core_changed.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history + tags for diff against previous tag

      - name: Check if NetPace.Core changed since previous tag
        id: core_changed
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^0")
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_COMMIT}^" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found — treating as first release, will publish."
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --quiet "$PREV_TAG".."${GITHUB_REF}" -- src/NetPace.Core; then
            echo "NetPace.Core unchanged since $PREV_TAG — skipping NuGet pack/push."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "NetPace.Core changed since $PREV_TAG — will publish."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore src

      # The compiler stamps the library's version, so the Build step needs the tag: Pack runs
      # with --no-build and can only set the package's own version.
      - name: Build
        run: |
          dotnet build src \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }}

      - name: Pack
        run: |
          dotnet pack src/NetPace.Core/NetPace.Core.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.version }} \
            -p:FileVersion=${{ steps.get_version.outputs.version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
            -p:RepositoryUrl=https://github.com/FrankRay78/NetPace \
            -o ./output

      - name: Verify packed library version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          $unpacked = Join-Path $env:RUNNER_TEMP 'nupkg'
          [System.IO.Compression.ZipFile]::ExtractToDirectory((Get-Item ./output/*.nupkg).FullName, $unpacked)
          $libraries = @(Get-ChildItem $unpacked -Recurse -Filter NetPace.Core.dll)
          if ($libraries.Count -eq 0) { throw 'No NetPace.Core.dll found in the package.' }
          foreach ($library in $libraries) {
            $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($library.FullName).Version.ToString(3)
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($library.FullName)
            $informational = ($info.ProductVersion -split '\+')[0]
            Write-Host "$($library.FullName): assembly=$assembly file=$($info.FileVersion) informational=$informational"
            if ($assembly -ne $env:EXPECTED_VERSION -or $info.FileVersion -ne $env:EXPECTED_VERSION -or $informational -ne $env:EXPECTED_VERSION) {
              throw "Packed library does not report the tag's version $env:EXPECTED_VERSION."
            }
          }

      - name: Publish to NuGet
        run: |
          dotnet nuget push ./output/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
