name: PR Issue Link

# Every pull request must close an open issue (issue #332). The PR body has to carry a closing
# keyword naming an existing, open issue in this repository; a bare `#N` reference or a
# Development-sidebar link alone does not count, because neither one closes the issue on merge.
#
# `edited` is in the trigger list on purpose. The usual failure is a body that names no issue, and
# the fix is an edit rather than a push — without `edited` the author would have to push an empty
# commit to re-run the gate it already told them how to satisfy.
#
# Deliberately its own workflow rather than a job in dotnet.yml or shell-tests.yml: the job name
# becomes the required-status-check context, and keeping it here means an unrelated change to the
# .NET build matrix or the shell-test discovery can never rename it out from under the ruleset.
#
# The check's own behaviour is gated separately — scripts/pr-issue-link-check.tests.sh is a
# committed `*.tests.sh`, so shell-tests.yml discovers and runs it with no entry needed here.

on:
  pull_request:
    types: [ opened, reopened, synchronize, edited, ready_for_review ]
    branches: [ "main" ]

# `edited` fires on every save of the body, so without this two quick edits start two runs of the
# same required context and the older one can be the last to report its (stale) conclusion.
concurrency:
  group: issue-link-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  # Needed because GitHub numbers issues and pull requests from one sequence: `gh issue view <N>`
  # resolves a PULL REQUEST at that number, and the check reports that as its own verdict ("#N is a
  # pull request, not an issue"). Without this scope that read is denied, the failure does not match
  # GitHub's not-found wording, and the run degrades to the outage message instead.
  pull-requests: read

jobs:
  # Do NOT add a `paths:` filter or an `if:` condition to this job. To GitHub a skipped job is not
  # a failure, so a required `issue-link` context is satisfied by one that never ran — and since
  # `pull_request` workflows are evaluated from the head ref, the branch adding the filter is the
  # branch it stops gating. The same hazard, and the same answer, as `traceability.yml`.
  issue-link:
    name: issue-link
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check the body closes an open issue
      # The body is author-controlled content, so it is passed through the environment and read
      # there rather than interpolated into the shell text of this step.
      #
      # The author comes from `user.login` rather than being inferred: the dependabot exemption is
      # the one thing that turns the gate off, so it is decided from the event payload's own field.
      #
      # The repository is passed in rather than resolved with `gh repo view`: one fewer API call,
      # and on a fork the value is the base repository, which is where the issue lives.
      env:
        GH_TOKEN: ${{ github.token }}
        PR_ISSUE_LINK_BODY: ${{ github.event.pull_request.body }}
        PR_ISSUE_LINK_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_ISSUE_LINK_REPO: ${{ github.repository }}
      run: bash scripts/pr-issue-link-check.sh
