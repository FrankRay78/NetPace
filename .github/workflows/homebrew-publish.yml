name: Publish Homebrew Tap

# Pushes an updated `netpace` formula to FrankRay78/homebrew-tap for each released version, so a
# macOS or Linux user's `brew upgrade` reaches the current release (docs/RELEASING.md,
# *Homebrew tap*).
#
# Deliberately its own workflow rather than a job in release-binaries.yml: pushing to another
# repository under a token the maintainer holds is a different function from building binaries,
# and it must not be able to fail a release that built and published correctly. A tap failure
# shows as its own red run and holds nothing back.
#
# Triggered by release-binaries.yml finishing rather than by the tag push that starts it, because
# the formula is rendered from the archives on the published release and they do not exist until
# that workflow has attached them. `release: published` is no good either — the GitHub Release is
# created first and the archives arrive afterwards, so it fires before there is anything to read.

on:
  workflow_run:
    # Matched on release-binaries.yml's `name:`, verbatim. Renaming it stops this one firing at
    # all, with no run for the failure job to attach to: change the two together.
    workflows: ["Build and Release Cross-Platform Binaries"]
    types: [completed]
  # Manual retry for a tap update that failed after the release itself was fine. Registered from
  # the default branch only, as all workflow_dispatch is.
  workflow_dispatch:
    inputs:
      version:
        description: 'Released version to publish, e.g. 0.9.0 (no "v" prefix)'
        required: true
        type: string

permissions:
  contents: read

env:
  # Homebrew strips the `homebrew-` prefix from the repository name, so both it and the formula
  # filename are user-typed contracts (docs/RELEASING.md, *Homebrew tap*).
  HOMEBREW_TAP_REPO: FrankRay78/homebrew-tap
  FORMULA_PATH: Formula/netpace.rb

jobs:
  formula:
    name: Render the formula
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A release-binaries.yml run that did not succeed has no complete set of archives. Which tags
    # are releases is decided below, an expression here being unable to match a pattern.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # On a workflow_run the tag that triggered release-binaries.yml arrives as head_branch;
      # GitHub populates it with the short ref, which for a tag push is the tag name.
      #
      # A release candidate is a clean skip, not a failure, which would raise a false issue on
      # every such tag. A version given by hand is never skipped.
      #
      # A ref of neither shape means head_branch did not hold the tag this step assumes, so it is
      # an error: a skip would leave the tap a version behind, green, until a user's `brew upgrade`.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          TRIGGERING_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            version="$TRIGGERING_REF"
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not determine the released version to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-. ]]; then
              echo "::notice::'$version' is a prerelease tag — the tap is unchanged."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not resolve a release tag from head_branch '$version'."
              exit 1
            fi
          fi
          echo "Publishing version: $version"
          echo "release=true" >> "$GITHUB_OUTPUT"

      # Fails before anything is rendered or pushed: a missing secret is one-off setup never done,
      # and skipping would report a release as published when nothing was.
      - name: Verify tap token is configured
        if: steps.version.outputs.release == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::Secret HOMEBREW_TAP_TOKEN is not set — see docs/RELEASING.md, One-off tap setup."
            exit 1
          fi

      # Refuses to emit a partial formula, so a release missing one archive stops here rather than
      # installing on some platforms and failing on the rest.
      - name: Render netpace.rb from the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/homebrew-formula.sh "$VERSION" > netpace.rb
          echo "Formula to publish:"
          cat netpace.rb

      - name: Upload the formula
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: netpace.rb

  # Installed before it is pushed, because the tap has no CI of its own and the first report
  # would be a user's failed `brew install`. Three of the four platforms; linux-arm64 below.
  verify:
    name: Install on ${{ matrix.runs_on }}
    needs: formula
    if: needs.formula.outputs.release == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20

    strategy:
      # Every platform reports its own verdict, so one red runner never hides the others.
      fail-fast: false
      matrix:
        include:
          # Split across architectures, as release-binaries.yml splits it: an Apple silicon
          # runner would install osx-arm64 either way, leaving the osx-x64 entry unverified.
          #
          # x64 only: Homebrew is not dependably pre-installed on GitHub's ARM64 Ubuntu images,
          # so that runner would turn every tap update red for want of `brew`.
          #
          # The linux-arm64 entry is structurally identical to the one checked, and its URL and
          # checksum come off the release either way.
          - runs_on: ubuntu-latest
          - runs_on: macos-15-intel
          - runs_on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Download the formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula

      # On Linux, Homebrew lives outside the default PATH on some image versions. Resolved here,
      # so a missing one fails saying so rather than as `brew: command not found` later.
      - name: Locate Homebrew
        run: |
          set -euo pipefail
          if ! command -v brew >/dev/null; then
            if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
              eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
              dirname "$(command -v brew)" >> "$GITHUB_PATH"
            else
              echo "::error::Homebrew is not available on ${{ matrix.runs_on }} — cannot verify the formula."
              exit 1
            fi
          fi
          brew --version

      # A throwaway local tap, because the point is to check this formula before the real tap
      # carries it. Not the file path, which Homebrew 5.0.0 refuses without HOMEBREW_DEVELOPER.
      - name: Install NetPace from the rendered formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew tap-new --no-git local/verify
          cp netpace.rb "$(brew --repository local/verify)/Formula/netpace.rb"
          brew install local/verify/netpace

      # The check the whole job exists for: a formula installing another version's archive would
      # otherwise reach users as a successful upgrade that changed nothing.
      #
      # On macOS this stands in for the Gatekeeper check: a formula's download carries no
      # quarantine flag, so an unsigned binary runs here where a browser download would not.
      - name: netpace --version reports the release
        env:
          VERSION: ${{ needs.formula.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(netpace --version)"
          echo "netpace --version: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "::error::Installed netpace reports '$reported', expected '$VERSION' — not pushing to the tap."
            exit 1
          fi

      # `brew uninstall` taking the command back off the path is part of what the tap promises,
      # and it costs one step to check on the same install.
      - name: brew uninstall removes the netpace command
        run: |
          set -euo pipefail
          brew uninstall local/verify/netpace
          if command -v netpace >/dev/null; then
            echo "::error::netpace is still on PATH after brew uninstall."
            exit 1
          fi

  publish:
    name: Push to the tap
    needs: [ formula, verify ]
    if: needs.formula.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One push at a time, so two close releases cannot race into a non-fast-forward rejection.
    # On this job, not the workflow, so prereleases and failed builds never queue here.
    #
    # GitHub cancels a waiting entry when another arrives, and a cancelled job, unlike a cancelled
    # run, still reaches report-failure.
    concurrency:
      group: homebrew-tap-push
      cancel-in-progress: false

    steps:
      - name: Checkout the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          # GITHUB_TOKEN has no access to another repository, so the push uses the maintainer's
          # token (docs/RELEASING.md, *One-off tap setup*).
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download the formula
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula

      # A retry of an already-published version stays a no-op: `git commit` would fail on an empty
      # commit and raise a failure issue for a tap that is correct.
      #
      # An older version than the tap carries is skipped, never pushed: a re-run of an old tag
      # would otherwise hand every `brew install` the older NetPace with nothing red.
      #
      # A skip rather than a failure, the tap being already ahead and correct.
      - name: Commit the formula
        working-directory: tap
        env:
          VERSION: ${{ needs.formula.outputs.version }}
        run: |
          set -euo pipefail
          if [ -f "$FORMULA_PATH" ]; then
            current="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$FORMULA_PATH")"
            if [ -z "$current" ]; then
              echo "::error::Could not read the version the tap carries from $FORMULA_PATH — not pushing over it."
              exit 1
            fi
            if [ "$current" != "$VERSION" ] && \
               [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" = "$current" ]; then
              echo "::warning::The tap already carries $current, newer than $VERSION — not pushing an older version over it."
              exit 0
            fi
          fi
          mkdir -p "$(dirname "$FORMULA_PATH")"
          cp ../netpace.rb "$FORMULA_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FORMULA_PATH"
          if git diff --cached --quiet; then
            echo "::notice::The tap already carries this formula for $VERSION — nothing to push."
            exit 0
          fi
          git commit -m "netpace $VERSION"
          git push

  # A workflow_run failure notifies nobody, so the failure is written where it will be read.
  #
  # Tests the render job's result and not only its output, so it covers that job breaking before
  # it set `release`. A tag that is not a release leaves every job skipped or clean.
  report-failure:
    name: Report a failed tap update
    needs: [ formula, verify, publish ]
    if: >-
      always() && (
        needs.formula.result == 'failure' || needs.formula.result == 'cancelled' ||
        (needs.formula.outputs.release == 'true' &&
         (needs.verify.result != 'success' || needs.publish.result != 'success'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Raise an issue naming the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.formula.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version="${VERSION:-unknown version}"
          printf '%s\n\n%s\n\n%s\n' \
            "The Homebrew tap update for \`$version\` did not complete, so \`brew upgrade\` will not reach this release." \
            "Run: $RUN_URL" \
            "See docs/RELEASING.md, *If a tap update fails*." > issue-body.md
          gh issue create \
            --title "Homebrew tap update failed for $version" \
            --body-file issue-body.md
