name: Claude Code

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.login == 'FrankRay78' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The model and effort come from the stage table, scripts/stage-models.tsv. A stage the
      # table does not answer fails here, before claude starts on whatever the default is.
      - name: Look up this stage's model
        id: model
        run: |
          args=$(bash scripts/stage-flags.sh claude-mention)
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '${{ steps.model.outputs.args }}'
          additional_permissions: |
            actions: read
