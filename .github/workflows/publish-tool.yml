name: Publish .NET Tool Package

# The NetPace .NET tool package: a wrapper package users name (`dotnet tool install -g netpace`) and
# one RID-specific package per platform it covers. docs/RELEASING.md, .NET tool package, records the
# package set, the gates and the push order.
#
# Its own workflow, independent of release-binaries.yml, so neither can fail the other: a tool-package
# problem never withholds the release archives, and an archive problem never withholds the package.
#
# Only semver-shaped tags trigger it, as for every release workflow: a tag means a release, and a
# prerelease-shaped tag such as 0.29.0-rc1 publishes too. docs/RELEASING.md, Release tags.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  # Native AOT cannot be cross-compiled across operating systems or architectures, so each RID
  # package packs on a matching runner. docs/RELEASING.md, Runner per RID.
  pack-native:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            runs_on: ubuntu-latest
          - runtime: linux-arm64
            runs_on: ubuntu-24.04-arm
          - runtime: win-x64
            runs_on: windows-latest
          - runtime: win-arm64
            runs_on: windows-11-arm
          - runtime: osx-x64
            runs_on: macos-15-intel
          - runtime: osx-arm64
            runs_on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A runs_on pointing at a valid runner of the wrong OS would compile, or fail, for the wrong RID.
      - name: Verify runner matches runtime
        run: |
          set -euo pipefail
          case "${{ matrix.runtime }}" in
            win-*)   expected="Windows" ;;
            linux-*) expected="Linux" ;;
            osx-*)   expected="macOS" ;;
            *)       echo "Unknown runtime prefix: ${{ matrix.runtime }}"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" != "$expected" ]; then
            echo "FAIL: runtime ${{ matrix.runtime }} requires runner OS '$expected', got '$RUNNER_OS'."
            exit 1
          fi
          # The two macOS RIDs share a runner OS, so the check above cannot tell them apart:
          # swapping them would compile for the wrong architecture and run it through Rosetta.
          case "${{ matrix.runtime }}" in
            osx-x64)   expected_arch="x86_64" ;;
            osx-arm64) expected_arch="arm64" ;;
            *)         expected_arch="" ;;
          esac
          if [ -n "$expected_arch" ] && [ "$(uname -m)" != "$expected_arch" ]; then
            echo "FAIL: runtime ${{ matrix.runtime }} requires a $expected_arch runner, got $(uname -m)."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AssemblyVersion and FileVersion accept numbers alone, so they take the tag's numeric part;
      # every other version property takes the whole tag. docs/RELEASING.md, Prerelease tags.
      - name: Extract version from tag
        id: get_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Pack RID-specific tool package
        run: |
          set -euo pipefail
          dotnet pack src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            -p:PublishAot=true \
            -p:InvariantGlobalization=true \
            -p:PackageVersion=${{ steps.get_version.outputs.version }} \
            -p:Version=${{ steps.get_version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.get_version.outputs.numeric_version }} \
            -p:FileVersion=${{ steps.get_version.outputs.numeric_version }} \
            -p:InformationalVersion=${{ steps.get_version.outputs.version }} \
            --output ./tool-package

      # Nothing else in this workflow runs a macOS binary before the push, the publish job's own
      # install check only ever exercising linux-x64.
      #
      # The RID package and the wrapper both go into a feed of their own, so what this job uploads
      # stays exactly what the AOT pack produced, whatever CreateRidSpecificToolPackages does.
      #
      # The Apple silicon installer was seen to request a host package only nuget.org holds, so it
      # is a source too; source mapping keeps a previously pushed copy from standing in.
      - name: Verify the installed tool reports the tag
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.get_version.outputs.numeric_version }}
        run: |
          set -euo pipefail
          mkdir ./verify-feed
          cp "./tool-package/NetPace.${{ matrix.runtime }}.$VERSION.nupkg" ./verify-feed/
          dotnet pack src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            -p:CreateRidSpecificToolPackages=false \
            -p:PackageVersion="$VERSION" \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$NUMERIC_VERSION" \
            -p:FileVersion="$NUMERIC_VERSION" \
            -p:InformationalVersion="$VERSION" \
            --output ./verify-feed
          cat > ./verify-nuget.config <<'CONFIG'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="verify-feed" value="./verify-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="verify-feed">
                <package pattern="NetPace" />
                <package pattern="NetPace.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          CONFIG
          dotnet tool install netpace --version "$VERSION" --configfile ./verify-nuget.config --tool-path ./tool-check
          reported=$(./tool-check/netpace --version)
          echo "netpace --version reported: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "FAIL: the installed tool reports '$reported', not the tag '$VERSION'."
            exit 1
          fi

      # Named exactly and erroring on no match: the default warns and reports success, so a pack
      # that stopped producing this file would surface a job later, pointing at the compile.
      - name: Upload RID-specific tool package
        uses: actions/upload-artifact@v4
        with:
          name: tool-package-${{ matrix.runtime }}
          path: ./tool-package/NetPace.${{ matrix.runtime }}.${{ steps.get_version.outputs.version }}.nupkg
          if-no-files-found: error

  # Needing pack-native means a failed or missing native pack stops the release before anything is
  # pushed; the check below says which RID is missing.
  publish:
    needs: pack-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write lets the job request the OIDC token the NuGet login step exchanges for a key.
    # Naming permissions replaces the defaults, so contents: read keeps the checkout working.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AssemblyVersion and FileVersion accept numbers alone, so they take the tag's numeric part;
      # every other version property takes the whole tag. docs/RELEASING.md, Prerelease tags.
      - name: Extract version from tag
        id: get_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric_version=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Download RID-specific tool packages
        uses: actions/download-artifact@v4
        with:
          pattern: tool-package-*
          merge-multiple: true
          path: ./tool-feed

      - name: Restore dependencies
        run: dotnet restore src

      # The wrapper carries no binary, only the list of RID packages the installer picks from.
      # CreateRidSpecificToolPackages=false stops this pack overwriting the Native AOT ones above.
      - name: Pack wrapper tool package
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NUMERIC_VERSION: ${{ steps.get_version.outputs.numeric_version }}
        run: |
          set -euo pipefail
          dotnet pack src/NetPace.Console/NetPace.Console.csproj \
            --configuration Release \
            -p:CreateRidSpecificToolPackages=false \
            -p:PackageVersion="$VERSION" \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$NUMERIC_VERSION" \
            -p:FileVersion="$NUMERIC_VERSION" \
            -p:InformationalVersion="$VERSION" \
            --output ./tool-feed

      # Exercises the chain end to end for this runner's RID: the wrapper resolves a RID package,
      # which carries a runnable binary reporting the tag, not the 0.0.0 source-build placeholder.
      #
      # By the lowercase id the docs tell users to type, and linux-x64 only: the two Mac entries
      # check themselves, and the step after this judges the rest.
      - name: Verify the installed tool reports the tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet tool install netpace --version "$VERSION" --source ./tool-feed --tool-path ./tool-check
          reported=$(./tool-check/netpace --version)
          echo "netpace --version reported: $reported"
          if [ "$reported" != "$VERSION" ]; then
            echo "FAIL: the installed tool reports '$reported', not the tag '$VERSION'."
            exit 1
          fi

      # Last, over the feed exactly as it will be pushed, so nothing packed in this job can replace
      # an AOT package unseen.
      #
      # The filename says nothing about what is inside, and both pack shapes set an executable
      # runner, so framework-dependent packages would ship to users promised a standalone binary.
      #
      # The entry count catches the other direction: a native symbol file riding along, which on
      # macOS is a netpace.dSYM folder rather than a single file.
      - name: Verify every RID package being pushed is Native AOT
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          missing=false
          for runtime in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            package="./tool-feed/NetPace.$runtime.$VERSION.nupkg"
            if [ ! -f "$package" ]; then
              echo "FAIL: no tool package for $runtime — its native build did not produce one."
              missing=true
              continue
            fi
            echo "$runtime: $(stat -c%s "$package") bytes"
            entries="$(python3 -I -c "import sys, zipfile; print('\n'.join(n for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.startswith('tools/')))" "$package")"
            if ! grep -q "^tools/any/$runtime/" <<<"$entries"; then
              echo "FAIL: $runtime is not a Native AOT package. Its tools/ entries are:"
              echo "$entries"
              missing=true
            elif [ "$(grep -c . <<<"$entries")" != 2 ]; then
              echo "FAIL: $runtime should carry the native binary and its settings file and nothing else. If a new SDK legitimately adds a file, adjust the expected count here and in docs/RELEASING.md:"
              echo "$entries"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then exit 1; fi

      # Trusted publishing exchanges the job's OIDC token for a key that expires within the hour,
      # so no long-lived key is stored. Run immediately before the push, after every gate.
      - name: Log in to NuGet
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The wrapper carries no nuspec dependencies, resolving its RID package at install time, so
      # nuget.org accepts one pointing at packages that were never published.
      #
      # Pushed last, so a part-way failure leaves the version simply not installable, which a
      # re-run fixes, rather than installable-and-broken on one platform.
      - name: Publish to NuGet
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          for runtime in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet nuget push "./tool-feed/NetPace.$runtime.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          dotnet nuget push "./tool-feed/NetPace.$VERSION.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
