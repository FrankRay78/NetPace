version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/"
    schedule:
      interval: "monthly"
      time: "23:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "FrankRay78"
    assignees:
      - "FrankRay78"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
