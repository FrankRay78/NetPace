version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/"
    # Routine bumps twice a year. A known advisory is handled separately by security updates,
    # which ignore this schedule and the cooldown below.
    schedule:
      interval: "semiannually"
      time: "23:00"
      timezone: "UTC"
    # Collapse every routine bump into a single grouped PR per run rather than one PR per package.
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Never ingest a release on its publish day, so a compromised or later-yanked publish ages
    # out before it can reach a pull request. Version updates only, not security updates.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    reviewers:
      - "FrankRay78"
    assignees:
      - "FrankRay78"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
