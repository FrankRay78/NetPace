services:
  librespeed:
    # The official LibreSpeed server image, so there is nothing to download and build: the
    # OoklaServer setup beside this one needs a Dockerfile because its binary is only
    # published as a tarball.
    image: ghcr.io/librespeed/speedtest:latest
    container_name: librespeed
    ports:
      # 18081, so this can run alongside the OoklaServer setup on 18080.
      - "18081:8080/tcp"
    restart: unless-stopped
    environment:
      # Standalone serves the test backend with no telemetry database behind it, which is
      # all NetPace speaks to. The install directory is then the web root, so the endpoints
      # are at /backend/empty.php and /backend/garbage.php.
      MODE: standalone
