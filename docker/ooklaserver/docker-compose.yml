services:
  ooklaserver:
    build: .
    image: local-ooklaserver
    container_name: ooklaserver
    ports:
      - "18080:8080/tcp"
      - "18080:8080/udp"
    restart: unless-stopped
    # tc needs NET_ADMIN to shape the container's own interface. Granted always, not
    # only when a profile is asked for: without it shape.sh refuses to start the
    # server rather than serve a fast link while claiming to be slow.
    cap_add:
      - NET_ADMIN
    environment:
      # Set by start.sh from its argument. Empty means no shaping — the fast local
      # server. The default keeps `docker compose up` on its own working unchanged.
      NETPACE_LINK_PROFILE: "${NETPACE_LINK_PROFILE:-}"
