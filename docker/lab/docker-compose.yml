# Named, so the start and stop scripts' `down --remove-orphans` can only ever touch this project,
# never a Compose project of the contributor's own in a directory that happens to share the name.
name: netpace-lab

services:
  # The only container that shapes anything: each server joins its network namespace rather than
  # having one of its own, so a difference between two providers' figures is the providers'.
  link:
    build:
      context: .
      dockerfile: Dockerfile.link
    image: netpace-lab-link
    container_name: netpace-lab-link
    ports:
      # OoklaServer, on the port it has always had. Every interface, so another machine on the
      # LAN can test against it.
      - "18080:8080/tcp"
      - "18080:8080/udp"
      # LibreSpeed, on the port it has always had. Loopback only, as before.
      - "127.0.0.1:18081:8081/tcp"
    # Compose cannot grant a capability conditionally, so it is granted always and shape.sh is
    # what refuses, exiting rather than holding open a fast link while claiming to be slow.
    cap_add:
      - NET_ADMIN
    environment:
      # Set by start.sh from its argument. Empty means no shaping — the full-speed lab. The
      # default keeps a bare `docker compose up` working unchanged.
      NETPACE_LINK_PROFILE: "${NETPACE_LINK_PROFILE:-}"

  # OoklaServer. Built rather than pulled: Ookla publishes the daemon only as a tarball.
  ooklaserver:
    build:
      context: .
      dockerfile: Dockerfile.ooklaserver
    image: netpace-lab-ooklaserver
    container_name: netpace-lab-ooklaserver
    # No ports, and not granted NET_ADMIN: it reaches the host through the link container's
    # published 18080, and over the link container's shaped interface.
    network_mode: "service:link"
    depends_on:
      # The healthcheck passes only once the link is in the state asked for, so this server never
      # takes a connection on an unshaped link and never starts behind a refused profile.
      link:
        condition: service_healthy

  # LibreSpeed's official image, pinned so a local run tests the server the docs describe rather
  # than whatever was published last.
  librespeed:
    image: ghcr.io/librespeed/speedtest:6.3.1
    container_name: netpace-lab-librespeed
    network_mode: "service:link"
    depends_on:
      link:
        condition: service_healthy
    environment:
      # Standalone serves the test backend with no telemetry database, which is all NetPace
      # speaks to; the install directory is then the web root.
      MODE: standalone
      # 8081 inside, not the image's default: both servers share one network namespace, so their
      # inside ports must differ, and WEBPORT is the cheaper of the two to move.
      WEBPORT: "8081"
